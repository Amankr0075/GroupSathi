{% load static %}
<style>
    /* --- Chatbot Widget Styles --- */
    #chatbot-widget {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }

    #chatbot-window {
        width: 380px;
        height: 550px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        display: none;
        flex-direction: column;
        overflow: hidden;
        margin-bottom: 24px;
        transform-origin: bottom right;
        animation: scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        border: 1px solid rgba(0,0,0,0.08);
    }

    @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.8) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .chat-header {
        background: var(--gs-primary, #0F172A);
        color: white;
        padding: 20px 24px;
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        font-size: 1.1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .chat-body {
        flex: 1;
        padding: 24px;
        overflow-y: auto;
        background: #F8FAFC;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .chat-msg {
        max-width: 85%;
        padding: 14px 18px;
        border-radius: 18px;
        font-size: 0.95rem;
        line-height: 1.5;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .msg-bot {
        background: white;
        color: #0F172A;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
        border: 1px solid rgba(0,0,0,0.03);
    }

    .msg-user {
        background: var(--gs-secondary, #3B82F6);
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }

    .chat-input-area {
        padding: 20px;
        background: white;
        border-top: 1px solid rgba(0,0,0,0.05);
        display: flex;
        gap: 12px;
    }

    .chat-input {
        flex: 1;
        border: 1px solid #E2E8F0;
        border-radius: 12px;
        padding: 12px 16px;
        outline: none;
        transition: all 0.2s;
        font-size: 0.95rem;
    }
    .chat-input:focus {
        border-color: var(--gs-secondary, #3B82F6);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .chat-send-btn {
        background: var(--gs-secondary, #3B82F6);
        color: white;
        border: none;
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
    }
    .chat-send-btn:hover {
        background: var(--gs-primary, #0F172A);
        transform: translateY(-2px);
    }

    .chatbot-fab {
        width: 65px;
        height: 65px;
        background: var(--gs-primary, #0F172A);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.8rem;
        box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.4);
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
    }
    
    .chatbot-fab img {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        object-fit: contain;
    }
    
    .chatbot-fab::before {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 24px;
        background: var(--gs-primary, #0F172A);
        opacity: 0.3;
        z-index: -1;
        animation: pulseFab 2s infinite;
    }

    @keyframes pulseFab {
        0% { transform: scale(1); opacity: 0.4; }
        100% { transform: scale(1.3); opacity: 0; }
    }

    .chatbot-fab:hover {
        transform: scale(1.05) translateY(-4px);
        box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.5);
    }

    @media (max-width: 768px) {
        #chatbot-widget {
            bottom: 80px; /* Above mobile CTA bar if any */
            right: 20px;
        }
        #chatbot-window {
            width: 320px;
            height: 400px;
        }
    }
</style>

<!-- Floating Chatbot Widget -->
<div id="chatbot-widget">
    <div id="chatbot-window">
        <div class="chat-header">
            <span><i class="bi bi-robot me-2"></i> GroupSathi AI</span>
            <i class="bi bi-x-lg" style="cursor: pointer;" onclick="toggleChat()"></i>
        </div>
        <div class="chat-body" id="chat-body">
            <div class="chat-msg msg-bot">
                Hello! I am the GroupSathi AI. {% if is_logged_in %}How can I help you manage your groups and finances today?{% else %}I can answer questions about our features, objectives, and how to get started. How can I help you today?{% endif %}
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" class="chat-input" placeholder="Ask a question..." onkeypress="handleEnter(event)">
            <button class="chat-send-btn" onclick="sendChat()">
                <i class="bi bi-send-fill"></i>
            </button>
        </div>
    </div>
    <div class="chatbot-fab" onclick="toggleChat()">
        <img src="{% static 'images/GroupSathi.png' %}" alt="AI" />
    </div>
</div>

<script>
    let isChatOpen = false;
    let chatHistory = [];
    const csrfToken = '{{ csrf_token }}';
    const apiEndpoint = '{% if is_logged_in %}/api/chatbot/ask/{% else %}/api/chatbot/public-ask/{% endif %}';

    function toggleChat() {
        const windowEl = document.getElementById('chatbot-window');
        isChatOpen = !isChatOpen;
        windowEl.style.display = isChatOpen ? 'flex' : 'none';
        if (isChatOpen) {
            document.getElementById('chat-input').focus();
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter') {
            sendChat();
        }
    }

    async function sendChat() {
        const inputEl = document.getElementById('chat-input');
        const text = inputEl.value.trim();
        if (!text) return;

        inputEl.value = '';
        appendMessage('User', text);
        chatHistory.push({ is_user: true, text: text });

        // Show typing indicator
        const typingId = "typing-" + Date.now();
        appendMessage('Bot', '<span class="typing-dots">...</span>', typingId);

        try {
            const response = await fetch(apiEndpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({
                    message: text,
                    history: chatHistory.slice(-4) // Keep last 4 messages for context (used by public API)
                })
            });

            const data = await response.json();
            
            // Remove typing indicator
            document.getElementById(typingId).remove();

            if (data.reply) {
                appendMessage('Bot', data.reply);
                chatHistory.push({ is_user: false, text: data.reply });
            } else {
                appendMessage('Bot', data.error || 'Sorry, I encountered an error.');
            }
        } catch (err) {
            document.getElementById(typingId).remove();
            appendMessage('Bot', 'Network error. Please try again later.');
        }
    }

    function appendMessage(sender, text, id=null) {
        const body = document.getElementById('chat-body');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'chat-msg ' + (sender === 'User' ? 'msg-user' : 'msg-bot');
        msgDiv.innerHTML = text; 
        if (id) msgDiv.id = id;
        body.appendChild(msgDiv);
        body.scrollTop = body.scrollHeight;
    }
</script>
