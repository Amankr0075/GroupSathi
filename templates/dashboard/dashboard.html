{% extends 'base.html' %}
{% load custom_filters static %}

{% block title %}Dashboard - GroupSathi{% endblock %}

{% block extra_css %}
<style>
    /* Premium Dashboard Styles */
    .dashboard-wrapper {
        padding: 1.25rem 0 3rem;
    }
    
    .welcome-banner {
        background: url('{% static "images/auth_rural_bg.png" %}') center/cover no-repeat;
        border-radius: 20px;
        padding: 3rem 2.5rem;
        color: #ffffff;
        position: relative;
        overflow: hidden;
        margin-bottom: 2rem;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }
    
    .welcome-banner::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(15,23,42,0.85) 0%, rgba(59,130,246,0.7) 100%);
        z-index: 0;
    }
    
    .welcome-content {
        position: relative;
        z-index: 1;
    }

    .welcome-title {
        font-family: 'Outfit', 'Inter', sans-serif;
        font-weight: 800;
        font-size: 1.8rem;
        margin-bottom: 0.3rem;
        letter-spacing: -0.5px;
        color: #ffffff;
    }
    
    .welcome-subtitle {
        font-size: 1rem;
        color: #e2e8f0;
        font-weight: 400;
        max-width: 500px;
        line-height: 1.5;
    }
    
    .gs-stats-row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 1.25rem;
    }

    .gs-stat-chip {
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 50px;
        padding: 0.5rem 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
        font-size: 0.85rem;
        color: #ffffff;
        transition: all 0.3s ease;
    }
    
    .gs-stat-chip:hover {
        background: rgba(255,255,255,0.2);
        transform: translateY(-2px);
    }

    .gs-stat-chip i {
        font-size: 0.9rem;
    }

    .gs-grid-section-title {
        font-family: 'Inter', sans-serif;
        font-size: 0.7rem;
        font-weight: 700;
        color: #94A3B8;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 1rem;
    }

    .gs-grid {
        display: grid;
        grid-template-columns: repeat(1, 1fr);
        gap: 1rem;
    }
    
    @media (min-width: 768px) {
        .gs-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }
    
    @media (min-width: 992px) {
        .gs-grid {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    @keyframes fadeUpPremium {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 767px) {
        .gs-grid {
            grid-template-columns: repeat(3, 1fr);
            gap: 12px; 
            padding: 16px 12px;
        }
        
        .gs-dash-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 4px; 
            border-radius: 10px;
            background: #ffffff;
            border: none;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            text-decoration: none;
            position: relative;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            min-height: 110px;
        }
        
        .gs-dash-card:active {
            transform: scale(0.96);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            background: #fcfcfc;
        }

        .gs-dash-card-icon {
            width: auto;
            height: 40px;
            background: transparent;
            color: var(--card-color, #6366f1);
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            margin-top: 0;
            box-shadow: none;
            border-radius: 0;
        }

        .gs-dash-card:hover .gs-dash-card-icon {
            /* Keep it transparent on mobile like the image */
            background: transparent;
            color: var(--card-color, #6366f1);
            transform: none;
        }

        .gs-dash-card-details {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .gs-dash-card-desc {
            display: none !important; /* Hide description on mobile */
        }

        .gs-dash-card-name {
            font-family: 'Montserrat', 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #222222;
            text-align: center;
            line-height: 1.25;
            width: 100%;
            margin: 0;
            padding: 0 4px;
            white-space: normal;
            word-wrap: break-word;
            display: block;
        }

        .gs-dash-card-arrow {
            display: none !important;
        }
        
        .gs-dash-card-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #ef4444;
            color: white;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 10px;
            box-shadow: 0 2px 4px rgba(239,68,68,0.3);
            z-index: 2;
        }

        /* Premium Subtle Stagger */
        .gs-dash-card:nth-child(1) { animation-delay: 0.04s; }
        .gs-dash-card:nth-child(2) { animation-delay: 0.08s; }
        .gs-dash-card:nth-child(3) { animation-delay: 0.12s; }
        .gs-dash-card:nth-child(4) { animation-delay: 0.16s; }
        .gs-dash-card:nth-child(5) { animation-delay: 0.20s; }
        .gs-dash-card:nth-child(6) { animation-delay: 0.24s; }
        .gs-dash-card:nth-child(7) { animation-delay: 0.28s; }
        .gs-dash-card:nth-child(8) { animation-delay: 0.32s; }
        .gs-dash-card:nth-child(9) { animation-delay: 0.36s; }
    }

    .gs-dash-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 1.25rem 1.5rem;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
        border: 1px solid #E2E8F0;
        text-decoration: none;
        display: flex;
        flex-direction: row;
        align-items: center;
        position: relative;
        overflow: hidden;
        gap: 1.2rem;
    }

    .gs-dash-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 20px -8px rgba(0, 0, 0, 0.08);
        border-color: color-mix(in srgb, var(--card-color, #6C5CE7) 30%, transparent);
    }

    .gs-dash-card-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        color: var(--card-color, #6C5CE7);
        background: color-mix(in srgb, var(--card-color, #6C5CE7) 12%, #ffffff);
        flex-shrink: 0;
        transition: all 0.3s ease;
    }

    .gs-dash-card:hover .gs-dash-card-icon {
        background: var(--card-color, #6C5CE7);
        color: white;
    }

    .gs-dash-card-name {
        font-weight: 600;
        font-size: 1.05rem;
        color: #1E293B;
        letter-spacing: -0.2px;
        margin: 0;
    }
    
    .gs-dash-card-arrow {
        margin-left: auto;
        color: #CBD5E1;
        font-size: 1.2rem;
        transition: all 0.3s ease;
    }
    
    .gs-dash-card:hover .gs-dash-card-arrow {
        color: var(--card-color, #6C5CE7);
        transform: translateX(4px);
    }

    .gs-dash-card-badge {
        position: absolute;
        top: 7px;
        right: 7px;
        background: #EF4444;
        color: #fff;
        font-size: 0.6rem;
        padding: 2px 5px;
        border-radius: 20px;
        font-weight: 800;
        box-shadow: 0 4px 8px rgba(239, 68, 68, 0.4);
        border: 2px solid #fff;
        z-index: 10;
        animation: badgePulse 2s infinite;
    }
    
    @keyframes badgePulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.12); }
        100% { transform: scale(1); }
    }
{% endblock %}

{% block content %}
<div class="container dashboard-wrapper">
    <div class="welcome-banner">
        <div class="welcome-content">
            <h2 class="welcome-title">Welcome{% if current_profile and current_profile.full_name %}, {{ current_profile.full_name }}{% endif %} 👋</h2>
            <p class="welcome-subtitle">Here is what's happening with your Self Help Groups today.</p>
            
            <div class="gs-stats-row">
                <div class="gs-stat-chip">
                    <i class="bi bi-people-fill" style="color: #74B9FF;"></i>
                    <span>{{ groups_count }} Group{{ groups_count|pluralize }}</span>
                </div>
                <div class="gs-stat-chip">
                    <i class="bi bi-cash-stack" style="color: #55efc4;"></i>
                    <span>{{ active_loans }} Active Loan{{ active_loans|pluralize }}</span>
                </div>
                {% if current_profile and current_profile.member_id %}
                <div class="gs-stat-chip">
                    <i class="bi bi-person-badge" style="color: #FBBF24;"></i>
                    <span>ID: {{ current_profile.member_id }}</span>
                </div>
                {% endif %}
            </div>
        </div>
    </div>

    <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:1rem;">
        <div style="width:3px; height:18px; background: linear-gradient(to bottom, #6C5CE7, #00CEC9); border-radius:2px;"></div>
        <h3 class="gs-grid-section-title" style="margin-bottom:0;">Quick Actions</h3>
    </div>
    <div class="gs-grid">
        {% for item in dashboard_items %}
        <a href="{% url item.url %}" class="gs-dash-card" style="--card-color: {{ item.color }};">
            {% if item.badge %}
            <span class="gs-dash-card-badge">{{ item.badge }}</span>
            {% endif %}
            <div class="gs-dash-card-icon">
                <i class="bi {{ item.icon }}"></i>
            </div>
            <span class="gs-dash-card-name">{{ item.name }}</span>
            <i class="bi bi-chevron-right gs-dash-card-arrow"></i>
        </a>
        {% endfor %}
        
        <!-- Share App Button -->
        <a href="#" onclick="shareGroupSathi(event)" class="gs-dash-card" style="--card-color: #EC4899;">
            <div class="gs-dash-card-icon">
                <i class="bi bi-share-fill"></i>
            </div>
            <span class="gs-dash-card-name">Share App</span>
            <i class="bi bi-chevron-right gs-dash-card-arrow"></i>
        </a>
        
        <!-- Contact Support Button -->
        <a href="{% url 'my_tickets' %}" class="gs-dash-card" style="--card-color: #6366F1;">
            <div class="gs-dash-card-icon">
                <i class="bi bi-headset"></i>
            </div>
            <span class="gs-dash-card-name">Contact Support</span>
            <i class="bi bi-chevron-right gs-dash-card-arrow"></i>
        </a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Detect if running in an App (Standalone PWA, TWA, or WebView)
    const isApp = window.matchMedia('(display-mode: standalone)').matches || 
                  window.navigator.standalone || 
                  document.referrer.includes('android-app://') ||
                  /wv|MicroMessenger|WebView/i.test(navigator.userAgent);
                  
    if (isApp) {
        document.body.classList.add('is-mobile-app');
    }
});

function shareGroupSathi(e) {
    e.preventDefault();
    const shareData = {
        title: 'GroupSathi',
        text: `🌟 GroupSathi - The Ultimate Self Help Group Management Platform 🌟

GroupSathi makes managing your SHG easy, transparent, and completely digital! Say goodbye to complex paper ledgers.

✨ Key Benefits & Features:
📊 100% Digital Ledger: Track loans, EMIs, and member savings accurately.
🤖 Smart AI Chatbot: Get instant help and insights with our built-in AI assistant!
⚖️ Transparent & Secure: Real-time financial reports and automated settlement calculations.
📄 Auto-Generated Documents: Get professional Legal Agreements and PDF Reports instantly.

Join thousands of groups managing their finances seamlessly today!

🌐 Official Website: https://groupsathi.duckdns.org/
📱 Download App: https://groupsathi.duckdns.org/download/app/`,
        url: 'https://groupsathi.duckdns.org/'
    };

    if (navigator.share) {
        navigator.share(shareData)
            .then(() => console.log('Successfully shared'))
            .catch((error) => console.log('Error sharing', error));
    } else {
        // Fallback for browsers that don't support Web Share API
        const dummy = document.createElement('textarea');
        document.body.appendChild(dummy);
        dummy.value = shareData.text;
        dummy.select();
        document.execCommand('copy');
        document.body.removeChild(dummy);
        alert('Share text and links copied to clipboard!');
    }
}
</script>
{% endblock %}
