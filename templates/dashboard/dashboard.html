{% extends 'base.html' %}
{% load custom_filters %}

{% block title %}Dashboard - GroupSathi{% endblock %}

{% block extra_css %}
<style>
    /* Premium Dashboard Styles */
    .dashboard-wrapper {
        padding: 1.25rem 0 3rem;
    }
    
    .welcome-banner {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
        border-radius: 20px;
        padding: 2rem 1.75rem;
        color: white;
        position: relative;
        overflow: hidden;
        margin-bottom: 2rem;
        box-shadow: 0 16px 40px -8px rgba(15, 23, 42, 0.4);
    }
    
    .welcome-banner::before {
        content: '';
        position: absolute;
        top: -80px;
        right: -80px;
        width: 260px;
        height: 260px;
        background: radial-gradient(circle, rgba(108,92,231,0.5) 0%, transparent 70%);
        border-radius: 50%;
        z-index: 0;
    }
    
    .welcome-banner::after {
        content: '';
        position: absolute;
        bottom: -60px;
        left: -40px;
        width: 180px;
        height: 180px;
        background: radial-gradient(circle, rgba(0,206,201,0.3) 0%, transparent 70%);
        border-radius: 50%;
        z-index: 0;
    }
    
    .welcome-content {
        position: relative;
        z-index: 1;
    }

    .welcome-title {
        font-family: 'Outfit', 'Inter', sans-serif;
        font-weight: 800;
        font-size: 1.6rem;
        margin-bottom: 0.3rem;
        letter-spacing: -0.5px;
    }
    
    .welcome-subtitle {
        font-size: 0.88rem;
        color: rgba(255,255,255,0.65);
        font-weight: 400;
        max-width: 500px;
        line-height: 1.5;
    }
    
    .gs-stats-row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 1.25rem;
    }

    .gs-stat-chip {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 50px;
        padding: 0.4rem 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-weight: 600;
        font-size: 0.78rem;
        color: rgba(255,255,255,0.9);
        transition: all 0.3s ease;
    }
    
    .gs-stat-chip:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
    }

    .gs-stat-chip i {
        font-size: 0.9rem;
    }

    .gs-grid-section-title {
        font-family: 'Inter', sans-serif;
        font-size: 0.7rem;
        font-weight: 700;
        color: #94A3B8;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 1rem;
    }

    .gs-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
    }
    
    @media (min-width: 480px) {
        .gs-grid {
            grid-template-columns: repeat(4, 1fr);
        }
    }
    
    @media (min-width: 768px) {
        .gs-grid {
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 1rem;
        }
    }

    .gs-dash-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 1.25rem 0.5rem 1rem;
        text-align: center;
        cursor: pointer;
        transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 2px 12px -2px rgba(0, 0, 0, 0.06), 0 0 0 1px rgba(0,0,0,0.03);
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        gap: 0.6rem;
    }

    .gs-dash-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 3px;
        background: var(--card-color, #6C5CE7);
        transition: all 0.3s ease;
    }

    .gs-dash-card:hover {
        transform: translateY(-6px) scale(1.02);
        box-shadow: 0 16px 30px -8px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0,0,0,0.02);
    }
    
    .gs-dash-card:hover::before {
        height: 100%;
        opacity: 0.05;
    }

    .gs-dash-card-icon {
        width: 46px;
        height: 46px;
        border-radius: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        color: var(--card-color, #6C5CE7);
        transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        background: color-mix(in srgb, var(--card-color, #6C5CE7) 12%, #ffffff);
        border: 1.5px solid color-mix(in srgb, var(--card-color, #6C5CE7) 18%, transparent);
        position: relative;
        z-index: 1;
    }

    .gs-dash-card:hover .gs-dash-card-icon {
        transform: scale(1.15) rotate(8deg);
        background: var(--card-color, #6C5CE7);
        color: white;
        box-shadow: 0 8px 20px -4px var(--card-color, #6C5CE7);
        border-color: transparent;
    }

    .gs-dash-card-name {
        font-weight: 700;
        font-size: 0.72rem;
        color: #374151;
        letter-spacing: -0.1px;
        line-height: 1.25;
        position: relative;
        z-index: 1;
        word-wrap: break-word;
        max-width: 100%;
        padding: 0 0.25rem;
    }

    .gs-dash-card-badge {
        position: absolute;
        top: 7px;
        right: 7px;
        background: #EF4444;
        color: #fff;
        font-size: 0.6rem;
        padding: 2px 5px;
        border-radius: 20px;
        font-weight: 800;
        box-shadow: 0 4px 8px rgba(239, 68, 68, 0.4);
        border: 2px solid #fff;
        z-index: 10;
        animation: badgePulse 2s infinite;
    }
    
    @keyframes badgePulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.12); }
        100% { transform: scale(1); }
    }
{% endblock %}

{% block content %}
<div class="container dashboard-wrapper">
    <div class="welcome-banner">
        <div class="welcome-content">
            <h2 class="welcome-title">Welcome{% if current_profile and current_profile.full_name %}, {{ current_profile.full_name }}{% endif %} 👋</h2>
            <p class="welcome-subtitle">Here is what's happening with your Self Help Groups today.</p>
            
            <div class="gs-stats-row">
                <div class="gs-stat-chip">
                    <i class="bi bi-people-fill" style="color: #74B9FF;"></i>
                    <span>{{ groups_count }} Group{{ groups_count|pluralize }}</span>
                </div>
                <div class="gs-stat-chip">
                    <i class="bi bi-cash-stack" style="color: #55efc4;"></i>
                    <span>{{ active_loans }} Active Loan{{ active_loans|pluralize }}</span>
                </div>
                {% if current_profile and current_profile.member_id %}
                <div class="gs-stat-chip">
                    <i class="bi bi-person-badge" style="color: #FBBF24;"></i>
                    <span>ID: {{ current_profile.member_id }}</span>
                </div>
                {% endif %}
            </div>
        </div>
    </div>

    <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:1rem;">
        <div style="width:3px; height:18px; background: linear-gradient(to bottom, #6C5CE7, #00CEC9); border-radius:2px;"></div>
        <h3 class="gs-grid-section-title" style="margin-bottom:0;">Quick Actions</h3>
    </div>
    <div class="gs-grid">
        {% for item in dashboard_items %}
        <a href="{% url item.url %}" class="gs-dash-card" style="--card-color: {{ item.color }};">
            {% if item.badge %}
            <span class="gs-dash-card-badge">{{ item.badge }}</span>
            {% endif %}
            <div class="gs-dash-card-icon">
                <i class="bi {{ item.icon }}"></i>
            </div>
            <span class="gs-dash-card-name">{{ item.name }}</span>
        </a>
        {% endfor %}
        
        <!-- Share App Button -->
        <a href="#" onclick="shareGroupSathi(event)" class="gs-dash-card" style="--card-color: #EC4899;">
            <div class="gs-dash-card-icon">
                <i class="bi bi-share-fill"></i>
            </div>
            <span class="gs-dash-card-name">Share App</span>
        </a>
        
        <!-- Contact Support Button -->
        <a href="{% url 'my_tickets' %}" class="gs-dash-card" style="--card-color: #6366F1;">
            <div class="gs-dash-card-icon">
                <i class="bi bi-headset"></i>
            </div>
            <span class="gs-dash-card-name">Contact Support</span>
        </a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function shareGroupSathi(e) {
    e.preventDefault();
    const shareData = {
        title: 'GroupSathi',
        text: 'GroupSathi is a smart management platform for Self Help Groups. Join now to manage loans, groups, and finances seamlessly!\n\nOfficial Website: https://groupsathi.duckdns.org/\nDownload APK: https://groupsathi.duckdns.org/download/app/',
        url: 'https://groupsathi.duckdns.org/'
    };

    if (navigator.share) {
        navigator.share(shareData)
            .then(() => console.log('Successfully shared'))
            .catch((error) => console.log('Error sharing', error));
    } else {
        // Fallback for browsers that don't support Web Share API
        const dummy = document.createElement('textarea');
        document.body.appendChild(dummy);
        dummy.value = shareData.text;
        dummy.select();
        document.execCommand('copy');
        document.body.removeChild(dummy);
        alert('Share text and links copied to clipboard!');
    }
}
</script>
{% endblock %}
