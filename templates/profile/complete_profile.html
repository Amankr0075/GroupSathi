{% extends 'base.html' %}

{% block title %}Complete Profile - GroupSathi{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <div class="gs-page-header justify-content-center">
        <i class="bi bi-person-check"></i>
        <h2>Complete Your Profile</h2>
    </div>

    <div class="gs-card">
        <p class="gs-text-muted gs-text-center gs-mb-2">Please fill in your details to get started</p>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="gs-form-group gs-text-center">
                <div class="gs-profile-avatar-placeholder" id="avatarPreviewWrap">
                    <i class="bi bi-camera" id="avatarIcon"></i>
                </div>
                <img id="avatarPreview" src="" alt="" class="gs-profile-avatar" style="display:none;">
                <label class="gs-btn gs-btn-secondary gs-btn-sm gs-mt-1" style="width:auto; cursor:pointer;">
                    <i class="bi bi-upload"></i> Upload Photo
                    <input type="file" name="profile_photo" accept="image/*" data-preview="avatarPreview" hidden>
                </label>
            </div>
            <div class="gs-form-group">
                <label>Full Name *</label>
                <input type="text" name="full_name" class="gs-input" placeholder="Enter your full name" value="{{ full_name|default:'' }}" required>
            </div>
            <div class="gs-form-group">
                <label>Gender *</label>
                <select name="gender" class="gs-input" required>
                    <option value="">Select Gender</option>
                    <option value="Male" {% if gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if gender == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>
            <div class="gs-form-group">
                <label>Mobile Number</label>
                <input type="text" class="gs-input" value="{{ profile.mobile|default:'' }}" disabled>
            </div>
            <div class="gs-form-group">
                <label>Address *</label>
                <textarea name="address" class="gs-input" rows="3" placeholder="Enter your full address" required>{{ address|default:'' }}</textarea>
            </div>
            <div class="gs-form-group">
                <label>PIN Code *</label>
                <input type="text" name="pin_code" class="gs-input" placeholder="6-digit PIN code" maxlength="6" value="{{ pin_code|default:'' }}" data-numeric required>
            </div>
            <button type="submit" class="gs-btn gs-btn-primary gs-mt-2">
                <i class="bi bi-check-circle"></i> Complete Profile
            </button>
        </form>
    </div>
</div>
{% endblock %}
