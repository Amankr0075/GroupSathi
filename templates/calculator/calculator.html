{% extends 'base.html' %}
{% load custom_filters %}

{% block title %}Calculator - GroupSathi{% endblock %}

{% block content %}
<div class="container animate__animated animate__fadeIn" style="max-width: 900px;">
    <div class="gs-page-header">
        <i class="bi bi-calculator-fill" style="color: var(--gs-accent);"></i>
        <h2>Smart Financial Calculator</h2>
        <a href="{% url 'dashboard' %}" class="gs-btn gs-btn-secondary gs-btn-sm ms-auto" style="width:auto;">
            <i class="bi bi-arrow-left"></i> Dashboard
        </a>
    </div>

        <!-- Tabs for mobile -->
        <div class="d-flex d-md-none mb-3 gap-2">
            <button id="btn-show-mobile" class="btn btn-primary flex-fill rounded-pill shadow-sm" style="font-size: 0.9rem;"><i class="bi bi-calculator"></i> Calculator</button>
            <button id="btn-show-interest" class="btn btn-light flex-fill rounded-pill shadow-sm" style="font-size: 0.9rem; border: 1px solid #e2e8f0;"><i class="bi bi-percent"></i> Interest</button>
        </div>

    <div class="row g-4 justify-content-center">
        <!-- Panel 1: Mobile Style Math Calculator -->
        <div id="panel-mobile" class="col-md-6 d-block">
            <div class="gs-card mx-auto" style="max-width: 340px; background: #1c1c1e; border: 4px solid #2c2c2e; border-radius: 36px; padding: 1.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.4);">
                <!-- Speaker / Notch details to look like iPhone -->
                <div class="d-flex justify-content-center mb-3" style="opacity: 0.3;">
                    <div style="width: 60px; height: 4px; background: #fff; border-radius: 2px;"></div>
                </div>

                <!-- Display screen -->
                <div style="background: #000; border-radius: 16px; padding: 1.2rem; text-align: right; margin-bottom: 1.5rem; min-height: 90px; display: flex; flex-direction: column; justify-content: flex-end;">
                    <div id="calc-expression" style="color: #8e8e93; font-size: 0.9rem; font-weight: 500; min-height: 1.2rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;"></div>
                    <div id="calc-display" style="color: #fff; font-size: 2.2rem; font-weight: 300; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: monospace;">0</div>
                </div>

                <!-- Keypad -->
                <div class="grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem;">
                    <!-- Row 1 -->
                    <button class="calc-btn btn-fn" onclick="clearCalc()">C</button>
                    <button class="calc-btn btn-fn" onclick="backspaceCalc()"><i class="bi bi-backspace"></i></button>
                    <button class="calc-btn btn-fn" onclick="appendOp('/')">÷</button>
                    <button class="calc-btn btn-op" onclick="appendOp('*')">×</button>

                    <!-- Row 2 -->
                    <button class="calc-btn btn-num" onclick="appendNum('7')">7</button>
                    <button class="calc-btn btn-num" onclick="appendNum('8')">8</button>
                    <button class="calc-btn btn-num" onclick="appendNum('9')">9</button>
                    <button class="calc-btn btn-op" onclick="appendOp('-')">-</button>

                    <!-- Row 3 -->
                    <button class="calc-btn btn-num" onclick="appendNum('4')">4</button>
                    <button class="calc-btn btn-num" onclick="appendNum('5')">5</button>
                    <button class="calc-btn btn-num" onclick="appendNum('6')">6</button>
                    <button class="calc-btn btn-op" onclick="appendOp('+')">+</button>

                    <!-- Row 4 -->
                    <button class="calc-btn btn-num" onclick="appendNum('1')">1</button>
                    <button class="calc-btn btn-num" onclick="appendNum('2')">2</button>
                    <button class="calc-btn btn-num" onclick="appendNum('3')">3</button>
                    <button class="calc-btn btn-op" onclick="calculateResult()" style="grid-row: span 2; height: 100%; background: var(--gs-success); color: white;">=</button>

                    <!-- Row 5 -->
                    <button class="calc-btn btn-num" onclick="appendNum('0')" style="grid-column: span 2;">0</button>
                    <button class="calc-btn btn-num" onclick="appendNum('.')">.</button>
                </div>
            </div>
        </div>

        <!-- Panel 2: Simple Interest Calculator (in terms of Months only) -->
        <div id="panel-interest" class="col-md-6 d-none d-md-block">
            <div class="gs-card h-100" style="padding: 2rem; border-left: 4px solid var(--gs-accent);">
                <div class="gs-card-header mb-4">
                    <i class="bi bi-percent" style="color: var(--gs-accent); font-size: 1.5rem;"></i>
                    <h3>Simple Interest (Months Only)</h3>
                </div>

                <div class="d-flex flex-column gap-3">
                    <div>
                        <label class="form-label gs-fw-600 mb-1" style="font-size: 0.9rem;">Principal Amount (₹)</label>
                        <input type="number" id="si-principal" class="gs-input" placeholder="e.g. 50000" min="0" oninput="calculateSI()">
                    </div>

                    <div>
                        <label class="form-label gs-fw-600 mb-1" style="font-size: 0.9rem;">Interest Rate (% Per Month)</label>
                        <input type="number" id="si-rate" class="gs-input" placeholder="e.g. 2" min="0" step="0.01" oninput="calculateSI()">
                    </div>

                    <div>
                        <label class="form-label gs-fw-600 mb-1" style="font-size: 0.9rem;">Tenure (Months Only)</label>
                        <input type="number" id="si-months" class="gs-input" placeholder="e.g. 12" min="1" step="1" oninput="calculateSI()">
                    </div>

                    <hr class="my-3" style="border-color: var(--gs-border-color);">

                    <!-- Live Results -->
                    <div class="p-3" style="background: var(--gs-body-bg); border-radius: 12px; border-left: 4px solid var(--gs-success);">
                        <strong class="d-block mb-3 text-success"><i class="bi bi-bar-chart-fill"></i> Calculation Summary:</strong>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="gs-text-muted">Principal:</span>
                            <strong id="res-principal">₹0.00</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="gs-text-muted">Total Interest:</span>
                            <strong id="res-interest" class="text-danger">₹0.00</strong>
                        </div>
                        <hr style="border-top: 1px dashed var(--gs-border-color); margin: 0.5rem 0;">
                        <div class="d-flex justify-content-between">
                            <span class="gs-fw-700">Total Payable:</span>
                            <strong id="res-total" style="color: var(--gs-primary); font-size: 1.15rem;">₹0.00</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Premium Mobile Calculator Styling */
    .calc-btn {
        width: 100%;
        height: 60px;
        border: none;
        border-radius: 50%;
        font-size: 1.4rem;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.1s, opacity 0.2s;
    }
    .calc-btn:active {
        transform: scale(0.92);
        opacity: 0.8;
    }
    .btn-num {
        background: #333333;
        color: #ffffff;
    }
    .btn-op {
        background: #ff9f0a;
        color: #ffffff;
    }
    .btn-fn {
        background: #a5a5a5;
        color: #000000;
    }
    /* Oval zero button */
    .calc-btn[style*="grid-column"] {
        border-radius: 30px;
        justify-content: flex-start;
        padding-left: 1.5rem;
    }
</style>

<script>
    // Tab Toggling for Mobile Viewports
    const btnShowMobile = document.getElementById('btn-show-mobile');
    const btnShowInterest = document.getElementById('btn-show-interest');
    const panelMobile = document.getElementById('panel-mobile');
    const panelInterest = document.getElementById('panel-interest');

    btnShowMobile.addEventListener('click', () => {
        btnShowMobile.className = 'btn btn-primary flex-fill rounded-pill shadow-sm';
        btnShowInterest.className = 'btn btn-light flex-fill rounded-pill shadow-sm';
        btnShowInterest.style.border = '1px solid #e2e8f0';
        panelMobile.classList.remove('d-none');
        panelMobile.classList.add('d-block');
        panelInterest.classList.add('d-none');
        panelInterest.classList.remove('d-block', 'd-md-block');
    });

    btnShowInterest.addEventListener('click', () => {
        btnShowInterest.className = 'btn btn-primary flex-fill rounded-pill shadow-sm';
        btnShowInterest.style.border = 'none';
        btnShowMobile.className = 'btn btn-light flex-fill rounded-pill shadow-sm';
        btnShowMobile.style.border = '1px solid #e2e8f0';
        panelInterest.classList.remove('d-none', 'd-md-block');
        panelInterest.classList.add('d-block');
        panelMobile.classList.add('d-none');
        panelMobile.classList.remove('d-block');
    });

    // Mobile Calculator Logic
    let currentInput = '';
    let expression = '';

    function appendNum(num) {
        if (num === '.' && currentInput.includes('.')) return;
        if (currentInput === '0' && num !== '.') {
            currentInput = num;
        } else {
            currentInput += num;
        }
        updateDisplay();
    }

    function appendOp(op) {
        if (currentInput === '' && expression === '') return;
        if (currentInput === '' && expression !== '') {
            // Replace last operator
            expression = expression.slice(0, -1) + op;
        } else {
            expression += currentInput + op;
            currentInput = '';
        }
        updateDisplay();
    }

    function clearCalc() {
        currentInput = '';
        expression = '';
        updateDisplay();
    }

    function backspaceCalc() {
        if (currentInput.length > 0) {
            currentInput = currentInput.slice(0, -1);
        }
        updateDisplay();
    }

    function calculateResult() {
        if (currentInput === '' && expression === '') return;
        let finalExpr = expression + currentInput;
        try {
            // Safe evaluation using simple tokens
            let sanitized = finalExpr.replace(/×/g, '*').replace(/÷/g, '/');
            let result = Function('"use strict";return (' + sanitized + ')')();
            currentInput = Number(result.toFixed(8)).toString();
            expression = '';
        } catch (e) {
            currentInput = 'Error';
            expression = '';
        }
        updateDisplay();
    }

    function updateDisplay() {
        const display = document.getElementById('calc-display');
        const exprElem = document.getElementById('calc-expression');
        
        display.innerText = currentInput || '0';
        exprElem.innerText = expression;
    }

    // Simple Interest Calculator Logic (Months Only)
    function calculateSI() {
        const principal = parseFloat(document.getElementById('si-principal').value) || 0;
        const rate = parseFloat(document.getElementById('si-rate').value) || 0;
        const months = parseFloat(document.getElementById('si-months').value) || 0;

        const interest = (principal * rate * months) / 100;
        const total = principal + interest;

        document.getElementById('res-principal').innerText = '₹' + principal.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        document.getElementById('res-interest').innerText = '₹' + interest.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        document.getElementById('res-total').innerText = '₹' + total.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
</script>
{% endblock %}
