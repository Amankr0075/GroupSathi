{% extends 'base.html' %}

{% block title %}Create Group - GroupSathi{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; padding: 2rem 15px;">
    <div class="gs-card shadow-lg border-0 rounded-4 overflow-hidden">
        <div class="gs-card-header text-white" style="background: linear-gradient(135deg, var(--gs-primary), var(--gs-secondary)); border-bottom: none; padding: 1.5rem;">
            <h3 class="mb-0 fw-bold"><i class="bi bi-plus-circle-fill me-2"></i>Create New Group</h3>
        </div>
        <form method="post" enctype="multipart/form-data" class="p-4 bg-white">
            {% csrf_token %}
            <div class="gs-form-group">
                <label>Group Name *</label>
                <input type="text" name="group_name" class="gs-input" placeholder="Enter group name" required>
            </div>

            <div class="gs-form-group">
                <label>Monthly EMI Amount (₹) *</label>
                <input type="number" name="emi_amount" class="gs-input" placeholder="e.g. 500" min="0" step="0.01" required>
            </div>
            <div class="gs-form-group">
                <label>Interest Rate (% per month) *</label>
                <input type="number" name="interest_rate" class="gs-input" placeholder="e.g. 2.0" min="0" step="0.01" required>
            </div>
            <div class="gs-form-group">
                <label>EMI Payment Date (Day of Month) *</label>
                <select name="emi_date" class="gs-input" required>
                    {% for day in "0123456789012345678901234567890"|make_list %}
                    <option value="{{ forloop.counter }}">{{ forloop.counter }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="gs-form-group">
                <label>Late EMI Fine (₹ per month) *</label>
                <input type="number" name="fine_amount" class="gs-input" placeholder="e.g. 50" min="0" step="0.01" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 gs-mt-2 rounded-pill shadow-sm" style="padding: 14px; font-size: 1.1rem; border:none; background: linear-gradient(135deg, var(--gs-secondary), var(--gs-primary));">
                <i class="bi bi-plus-circle-fill me-2"></i> Create Group
            </button>
        </form>
    </div>
</div>
{% endblock %}
