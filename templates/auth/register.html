{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GroupSathi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="gs-auth-wrapper">
    <div class="gs-auth-card">
        <div class="gs-auth-logo">
            <i class="bi bi-people-fill"></i>
            <h1>GroupSathi</h1>
            <p>Create your account</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show gs-alert" role="alert" style="font-size:0.85rem;">
            {{ message }}
            <button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}

        <form method="post" autocomplete="off">
            {% csrf_token %}
            <div class="gs-form-group">
                <label>Mobile Number</label>
                <div class="gs-input-icon">
                    <i class="bi bi-phone"></i>
                    <input type="text" name="mobile" class="gs-input" placeholder="Enter 10-digit mobile number" maxlength="10" value="{{ mobile|default:'' }}" data-numeric required>
                </div>
            </div>
            <div class="gs-form-group">
                <label>Password (5-digit numeric PIN)</label>
                <div class="gs-input-icon">
                    <i class="bi bi-lock"></i>
                    <input type="password" name="password" class="gs-input" placeholder="Create 5-digit PIN" maxlength="5" data-numeric required>
                </div>
            </div>
            <div class="gs-form-group">
                <label>Confirm Password</label>
                <div class="gs-input-icon">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" name="confirm_password" class="gs-input" placeholder="Confirm 5-digit PIN" maxlength="5" data-numeric required>
                </div>
            </div>
            <button type="submit" class="gs-btn gs-btn-primary gs-mt-2">
                <i class="bi bi-person-plus"></i> Register
            </button>
        </form>
        <p class="text-center gs-mt-2" style="font-size:0.9rem;">
            Already have an account? <a href="{% url 'login' %}" class="gs-fw-600">Login here</a>
        </p>

        <div class="gs-download-divider">
            <span>Get the App</span>
        </div>

        <a href="{% url 'download_apk' %}" class="gs-btn gs-btn-download" id="btn-download-apk-register">
            <i class="bi bi-android2"></i>
            <div class="gs-download-btn-text">
                <span class="gs-download-label">Download for Android</span>
                <span class="gs-download-sub">GroupSathi APK · Free</span>
            </div>
            <i class="bi bi-download gs-download-arrow"></i>
        </a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
