{% extends 'base.html' %}
{% load static %}

{% block title %}Staff Login - GroupSathi{% endblock %}

{% block content %}
<div class="auth-wrapper" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; background-color: #f8fafc;">
    <div class="container" style="max-width: 450px;">
        <div class="gs-card text-center py-5 px-4" style="border-radius: 24px; box-shadow: 0 20px 40px -15px rgba(0,0,0,0.1);">
            <div class="mb-4">
                <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3rem; background: linear-gradient(135deg, var(--gs-primary), var(--gs-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
            </div>
            
            <h2 class="fw-bold mb-2" style="font-family: 'Outfit', sans-serif;">Staff Portal</h2>
            <p class="text-muted mb-4">Secure access for administrators and technical staff.</p>

            <form method="post" action="{% url 'admin_login' %}">
                {% csrf_token %}
                <div class="gs-form-group text-start">
                    <label class="fw-bold text-muted small ms-1">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0" style="border-radius: 12px 0 0 12px; border: 1px solid #E2E8F0;"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="email" name="email" class="form-control gs-input border-start-0" placeholder="admin@groupsathi.com" required style="border-radius: 0 12px 12px 0; border: 1px solid #E2E8F0; padding-left: 0;">
                    </div>
                </div>

                <div class="gs-form-group text-start mt-3">
                    <label class="fw-bold text-muted small ms-1">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0" style="border-radius: 12px 0 0 12px; border: 1px solid #E2E8F0;"><i class="bi bi-key text-muted"></i></span>
                        <input type="password" name="password" class="form-control gs-input border-start-0" placeholder="••••••••" required style="border-radius: 0 12px 12px 0; border: 1px solid #E2E8F0; padding-left: 0;">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-4 rounded-pill shadow-sm fw-bold py-3" style="font-size: 1.1rem; background: linear-gradient(135deg, var(--gs-primary), var(--gs-secondary)); border: none;">
                    Secure Login <i class="bi bi-arrow-right-circle ms-2"></i>
                </button>
            </form>
            
            <div class="mt-4 pt-4 border-top">
                <a href="{% url 'login' %}" class="text-decoration-none text-muted fw-bold" style="font-size: 0.9rem;">
                    <i class="bi bi-arrow-left me-1"></i> Return to Member Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
