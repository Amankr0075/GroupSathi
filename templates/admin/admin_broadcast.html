{% extends 'base.html' %}

{% block title %}Admin - System Broadcast{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <a href="{% url 'custom_admin_dashboard' %}" class="gs-back-btn"><i class="bi bi-arrow-left"></i> Admin Dashboard</a>
    
    <div class="gs-card">
        <div class="gs-card-header text-white" style="background: linear-gradient(135deg, #f59e0b, #d97706); border-bottom: none; padding: 1.5rem;">
            <h3 class="mb-0 fw-bold"><i class="bi bi-broadcast me-2"></i>System Broadcast</h3>
        </div>
        <form method="post" class="p-4 bg-white">
            {% csrf_token %}
            <p class="text-muted mb-3">Send a notification alert to every active user on the platform.</p>
            
            <div class="gs-form-group">
                <label>Title *</label>
                <input type="text" name="title" class="gs-input" placeholder="e.g. System Maintenance" required>
            </div>
            <div class="gs-form-group">
                <label>Message *</label>
                <textarea name="message" class="gs-input" rows="4" placeholder="Enter broadcast message..." required></textarea>
            </div>
            <div class="gs-form-group">
                <label>Alert Type</label>
                <select name="type" class="gs-input">
                    <option value="info">Info (Blue)</option>
                    <option value="warning">Warning (Yellow)</option>
                    <option value="danger">Urgent (Red)</option>
                    <option value="success">Success (Green)</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-warning w-100 mt-2 rounded-pill shadow-sm text-dark" style="padding: 14px; font-size: 1.1rem; border:none; font-weight:600;">
                <i class="bi bi-send-fill me-2"></i> Send Broadcast
            </button>
        </form>
    </div>
</div>
{% endblock %}
