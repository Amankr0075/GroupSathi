{% extends 'base.html' %}
{% load custom_filters %}

{% block title %}Admin - Edit Group{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <a href="{% url 'custom_admin_groups' %}" class="gs-back-btn"><i class="bi bi-arrow-left"></i> Back to Groups</a>
    
    <div class="gs-card">
        <div class="gs-card-header">
            <i class="bi bi-pencil-square"></i>
            <h3>Edit Group: {{ group.name }}</h3>
        </div>
        
        <form action="{% url 'admin_edit_group' group.group_id %}" method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Group Name</label>
                <input type="text" name="name" class="form-control gs-input" value="{{ group.name }}" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">EMI Amount (,1)</label>
                <input type="number" name="emi_amount" class="form-control gs-input" value="{{ group.emi_amount }}" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Interest Rate (%)</label>
                <input type="number" step="0.1" name="interest_rate" class="form-control gs-input" value="{{ group.interest_rate }}" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">EMI Date (1-31)</label>
                <input type="number" name="emi_date" class="form-control gs-input" value="{{ group.emi_date }}" required min="1" max="31">
            </div>
            
            <div class="mb-4">
                <label class="form-label text-muted small fw-bold">Fine Amount (,1)</label>
                <input type="number" name="fine_amount" class="form-control gs-input" value="{{ group.fine_amount }}" required>
            </div>
            
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary gs-btn rounded-pill fw-bold">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
